name: Remote script execution

# Manual dispatch only. The workflow file on the default branch is the
# bootstrap. Pull-request events are not triggers, so forked pull requests
# do not receive this workflow's credentials.
on:
  workflow_dispatch:
    inputs:
      schema_version:
        description: "Request schema version. Must be 1."
        required: true
        type: string
        default: "1"
      request_id:
        description: "Unique caller request id."
        required: true
        type: string
      repository:
        description: "Fixed repository Awannaphasch2016/quant-software-factory."
        required: true
        type: string
        default: "Awannaphasch2016/quant-software-factory"
      code_sha:
        description: "Full 40-character lowercase approved commit SHA."
        required: true
        type: string
      script_path:
        description: "Approved repo-relative Python script path."
        required: true
        type: string
      input_json:
        description: "One JSON value passed to the script on stdin."
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute:
    name: Prepare and execute
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    outputs:
      record_ready: ${{ steps.execute.outputs.record_ready || steps.preflight.outputs.record_ready }}
      record_sha256: ${{ steps.execute.outputs.record_sha256 || steps.preflight.outputs.record_sha256 }}
      execution_id: ${{ steps.execute.outputs.execution_id || steps.preflight.outputs.execution_id }}
      computation_status: ${{ steps.execute.outputs.computation_status || steps.preflight.outputs.computation_status }}
    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: trusted
          fetch-depth: 1

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.16"

      - name: Preflight request
        id: preflight
        working-directory: trusted
        env:
          EXECUTION_SCHEMA_VERSION: ${{ inputs.schema_version }}
          EXECUTION_REQUEST_ID: ${{ inputs.request_id }}
          EXECUTION_REPOSITORY: ${{ inputs.repository }}
          EXECUTION_CODE_SHA: ${{ inputs.code_sha }}
          EXECUTION_SCRIPT_PATH: ${{ inputs.script_path }}
          EXECUTION_INPUT_JSON: ${{ inputs.input_json }}
          EXECUTION_TRUSTED_ROOT: ${{ github.workspace }}/trusted
          EXECUTION_OUTPUT_DIR: ${{ github.workspace }}/output
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_ACTIONS: "true"
        run: python -B -m execution.runner preflight

      - name: Checkout approved candidate
        if: steps.preflight.outputs.sha_ok == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.code_sha }}
          persist-credentials: false
          path: candidate
          fetch-depth: 1

      - name: Prepare and execute
        id: execute
        if: steps.preflight.outputs.sha_ok == 'true'
        working-directory: trusted
        env:
          EXECUTION_SCHEMA_VERSION: ${{ inputs.schema_version }}
          EXECUTION_REQUEST_ID: ${{ inputs.request_id }}
          EXECUTION_REPOSITORY: ${{ inputs.repository }}
          EXECUTION_CODE_SHA: ${{ inputs.code_sha }}
          EXECUTION_SCRIPT_PATH: ${{ inputs.script_path }}
          EXECUTION_INPUT_JSON: ${{ inputs.input_json }}
          EXECUTION_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          EXECUTION_TRUSTED_ROOT: ${{ github.workspace }}/trusted
          EXECUTION_OUTPUT_DIR: ${{ github.workspace }}/output
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_ACTIONS: "true"
        run: python -B -m execution.runner run

      - name: Upload execution record artifact
        if: always() && (steps.execute.outputs.record_ready == 'true' || steps.preflight.outputs.record_ready == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: execution-record
          path: output/
          if-no-files-found: error
          retention-days: 14

  upload:
    name: Upload execution record
    needs: execute
    if: always() && needs.execute.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: execution-upload
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout trusted uploader
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: trusted
          fetch-depth: 1

      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"

      - name: Install pinned uploader dependencies
        working-directory: trusted/execution/uploader
        run: npm ci --ignore-scripts

      - name: Download execution record
        if: needs.execute.outputs.record_ready == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: execution-record
          path: record

      - name: Upload record to private blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          EXECUTION_RECORD_READY: ${{ needs.execute.outputs.record_ready }}
          EXECUTION_RECORD_PATH: ${{ github.workspace }}/record/execution_record.json
          EXPECTED_RECORD_SHA256: ${{ needs.execute.outputs.record_sha256 }}
          EXECUTION_RECEIPT_PATH: ${{ github.workspace }}/receipt.json
          EXECUTION_TRUSTED_ROOT: ${{ github.workspace }}/trusted
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        working-directory: trusted
        run: node execution/uploader/upload_record.mjs

      - name: Upload receipt artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: execution-receipt
          path: receipt.json
          if-no-files-found: warn
          retention-days: 14
